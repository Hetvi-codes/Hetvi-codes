</style><rect class="card" x="1" y="1" width="898" height="344" rx="12"/><circle cx="22" cy="22" r="6" fill="#FF5F57" stroke="#E0443E" stroke-width=".7"/><circle cx="42" cy="22" r="6" fill="#FEBC2E" stroke="#DEA123" stroke-width=".7"/><circle cx="62" cy="22" r="6" fill="#28C840" stroke="#1AAB29" stroke-width=".7"/><text class="dim" x="450.0" y="26" font-size="12" text-anchor="middle">about.md</text><line class="rule" x1="1" y1="44" x2="899" y2="44"/><text class="fg" x="40" y="80" font-size="17" font-weight="700">Building software that thinks, adapts, and removes friction.</text><text class="dim" x="40" y="103" font-size="13">CS student with a minor in Adaptive AI — curious about how machines learn, reason, and interact.</text><line class="rule" x1="24" y1="122" x2="876" y2="122" stroke-dasharray="3 5"/><text x="40" y="148" font-size="13"><tspan class="acc">$</tspan><tspan class="dim"> cat </tspan><tspan class="fg" font-weight="700">what_drives_me.txt</tspan></text><rect class="acc" x="40" y="167" width="6" height="6" rx="1.5"/><text class="fg" x="58" y="175" font-size="13"><tspan class="acc" font-weight="700">Adaptive Intelligence ·</tspan> Fascinated by systems that evolve dynamically rather than staying static.</text><rect class="acc" x="40" y="195" width="6" height="6" rx="1.5"/><text class="fg" x="58" y="203" font-size="13"><tspan class="acc" font-weight="700">Fintech &amp; High-Stakes Logic ·</tspan> Drawn to finding signals in noisy data and anticipating anomalies.</text><rect class="acc" x="40" y="223" width="6" height="6" rx="1.5"/><text class="fg" x="58" y="231" font-size="13"><tspan class="acc" font-weight="700">Multi-Modal Experiences ·</tspan> Interested in tech that connects vision and language to feel intuitive.</text><rect class="acc" x="40" y="251" width="6" height="6" rx="1.5"/><text class="fg" x="58" y="259" font-size="13"><tspan class="acc" font-weight="700">The Builder's Mindset ·</tspan> If a problem is repetitive, automate it; if it's complex, simplify the interface.</text><rect class="acc" x="40" y="279" width="6" height="6" rx="1.5"/><text class="fg" x="58" y="287" font-size="13"><tspan class="acc" font-weight="700">Continuous Curiosity ·</tspan> Always tinkering, questioning how things work under the hood, and trying wild ideas.</text><line class="rule" x1="24" y1="308" x2="876" y2="308" stroke-dasharray="3 5"/><text x="40" y="328" font-size="12"><tspan class="acc">$</tspan><tspan class="dim"> echo </tspan><tspan class="fg">"always excited to talk ideas, brainstorm, and build cool things"</tspan></text></svg>